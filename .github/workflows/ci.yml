name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.cppm' \
            | xargs clang-format --dry-run --Werror

  build-and-test:
    # macOS is the only platform with an implemented backend, and the test and example
    # targets require one. Add an entry here together with the backend, not before it.
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel
      - name: Test
        run: ctest --preset debug
