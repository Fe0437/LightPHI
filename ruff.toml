# Ruff's configuration: the formatter and linter policy for every Python file in the repository.
#
# This is `ruff.toml` rather than `pyproject.toml` because there is no Python package here to
# describe. LightPHI is a C++23 project whose only Python is the documentation build under
# `tools/docs/`. The C/C++ half of the same policy lives in .clang-format and .clang-tidy.

# The column limit .clang-format sets for C++, so one number governs the whole repository.
line-length = 120

# `tools/docs/build_docs.py` selects a newer Python to host the documentation toolchain, so it has
# to run under whatever the operating system supplies. That is the oldest interpreter here.
target-version = "py39"

extend-exclude = [
    "build",
    # A submodule with its own policy. It is not this repository's code to reformat.
    "skills",
    # Generated by the guidelines skill and rebuilt on demand, not source.
    ".guidelines-cache",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[lint.isort]
# Sort by module name whatever the import form, matching the existing sources.
force-sort-within-sections = true
